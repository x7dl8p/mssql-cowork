name: Build & Release Plugin

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: |
          cd mcp-server
          npm ci

      - name: Bundle with esbuild
        run: |
          cd mcp-server
          npx esbuild index.js \
            --bundle \
            --platform=node \
            --outfile=bundle.js \
            --log-level=warning
          echo "Bundle size: $(du -sh bundle.js | cut -f1)"

      - name: Package plugin
        run: node scripts/package.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mssql-cowork-plugin
          path: mssql-cowork.plugin
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd mcp-server && npm ci

      - name: Bundle
        run: |
          cd mcp-server
          npx esbuild index.js --bundle --platform=node --outfile=bundle.js --log-level=warning

      - name: Package
        run: node scripts/package.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mssql-cowork.plugin
          generate_release_notes: true
